<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>11/11測試版</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background-color: #2c3e50;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: white;
            overflow: hidden; /* 防止滑動畫面 */
        }
        #gameCanvas {
            background-color: #ecf0f1;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border-radius: 8px;
        }
        .instructions {
            margin-top: 15px;<script src="main.js"></script>
            text-align: center;
            font-size: 14px;
            color: #bdc3c7;
        }
    </style>
</head>
<body>
    <button id="fsBtn">全螢幕</button>
    <!-- 遊戲畫布 -->
    <canvas id="gameCanvas" width="window.innerWidth" height="window.innerHeight"></canvas>
    <script src="game.js"></script>
</body>
</html>
